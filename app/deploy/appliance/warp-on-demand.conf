[Unit]
StopWhenUnneeded=yes

[Service]
LogLevelMax=warning
# LogsDirectory otherwise bind-mounts the persistent directory over the tmpfs.
LogsDirectory=
Environment=LOGS_DIRECTORY=/var/log/cloudflare-warp
# Vendor diagnostic files are private RAM storage, discarded whenever WARP stops.
# Registration and settings in /var/lib/cloudflare-warp remain persistent.
TemporaryFileSystem=/var/log/cloudflare-warp:rw,nosuid,nodev,noexec,size=32M,mode=0700
