# Named clients for the dedicated PipeWire server. The old speaker PCM remains
# the physical backend, preventing a recursive default-device route.
pcm.thinksmart_media {
    type pipewire
    playback_node "thinksmart.media"
}
pcm.thinksmart_voice {
    type pipewire
    playback_node "thinksmart.mix"
}
pcm.!default {
    type asym
    playback.pcm "thinksmart_media"
    capture.pcm "plughw:0,1"
}
