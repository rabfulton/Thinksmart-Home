# Dedicated graph for the ThinkSmart; no hardware probing or Bluetooth roles.
context.properties = {
    core.name = pipewire-0
    core.daemon = true
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    clock.power-of-two-quantum = false
    default.clock.quantum = 480
    default.clock.min-quantum = 480
    default.clock.max-quantum = 480
    mem.allow-mlock = true
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    api.alsa.* = alsa/libspa-alsa
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 rt.prio = 20 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]
context.objects = [
    { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver priority.driver = 20000 } }
    { factory = adapter args = {
        factory.name = api.alsa.pcm.sink
        node.name = thinksmart.speaker
        node.description = "ThinkSmart physical speaker"
        media.class = Audio/Sink
        api.alsa.path = speaker
        api.alsa.disable-mmap = true
        api.alsa.period-size = 480
        api.alsa.period-num = 8
        audio.format = S16LE
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.pause-on-idle = false
        priority.driver = 30000
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = thinksmart.mix
        node.description = "ThinkSmart complete speaker mix"
        media.class = Audio/Sink
        audio.channels = 1
        audio.position = [ MONO ]
        audio.rate = 48000
        node.virtual = true
        node.pause-on-idle = false
        monitor.channel-volumes = true
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = thinksmart.media
        node.description = "ThinkSmart radio and music"
        media.class = Audio/Sink
        audio.channels = 1
        audio.position = [ MONO ]
        audio.rate = 48000
        node.virtual = true
        node.pause-on-idle = false
        monitor.channel-volumes = true
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
